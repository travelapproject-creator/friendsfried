<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:#FBF7EC;border:2px solid #22190F;border-radius:3px;overflow:hidden;box-shadow:3px 4px 0 rgba(34,25,15,.8)">
  <div style="display:flex;align-items:center;gap:7px;padding:8px 9px">
    <span style="font-size:16px">🥑</span>
    <span style="font-weight:700;font-size:12.5px">Natasha</span>
    <span style="font-family:'Space Mono',monospace;margin-left:auto;font-size:8.5px;letter-spacing:.1em;color:#6B5B48">SEAT 1</span>
  </div>
  <div style="position:relative;border-top:2px solid #22190F;border-bottom:2px solid #22190F">
    <img src="{{ plateImg }}" alt="Three donuts and a decaf cold brew" style="display:block;width:100%;aspect-ratio:4/5;object-fit:cover"></img>
    <sc-if value="{{ stamped }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;right:-6px;bottom:-13px;border:2px solid #22190F;border-radius:3px;padding:4px 9px;color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:23px;line-height:1;box-shadow:3px 4px 0 rgba(34,25,15,.85);transform:rotate(-5deg);background:#DC4230;animation:ffStampIn .4s cubic-bezier(.2,1.6,.5,1) both">3<span style="font-family:'Space Mono',monospace;font-size:10px;font-weight:700;opacity:.8">/10</span></div>
    </sc-if>
  </div>
  <div style="padding:17px 10px 9px">
    <sc-if value="{{ scored }}" hint-placeholder-val="{{ false }}">
      <div style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:13.5px;letter-spacing:-.02em;animation:ffFadeIn .35s ease both">Three donuts, decaf cold brew</div>
      <div style="font-size:11.5px;line-height:1.4;color:#6B5B48;margin-top:4px;animation:ffFadeIn .35s ease both">Fried dough with sugar glaze and chocolate, plus an iced coffee. No vegetables or protein on the plate.</div>
    </sc-if>
    <sc-if value="{{ notScored }}" hint-placeholder-val="{{ true }}">
      <div style="font-size:11.5px;line-height:1.4;color:#6B5B48;text-align:center;padding:6px 0">Analyzing…</div>
    </sc-if>
  </div>
  <sc-if value="{{ scored }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;border-top:2px dashed rgba(34,25,15,.3)">
      <div style="flex:1;padding:8px 4px;text-align:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:11px;text-transform:uppercase;background:{{ praiseBg }};color:{{ praiseColor }}">👏 Praise{{ praiseSuffix }}</div>
      <div style="width:2px;background:rgba(34,25,15,.3)"></div>
      <div style="flex:1;padding:8px 4px;text-align:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:11px;text-transform:uppercase;background:{{ judgeBg }};color:{{ judgeColor }}">🔥 Judge{{ judgeSuffix }}</div>
    </div>
  </sc-if>
  <sc-for list="{{ says }}" as="s" hint-placeholder-count="0">
    <div style="{{ s.style }}animation:ffFadeIn .35s ease both">
      <span style="margin-right:4px">{{ s.emoji }}</span><b>{{ s.name }}</b> <span style="color:#6B5B48">{{ s.text }}</span>
    </div>
  </sc-for>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:320},&quot;pr&quot;:{&quot;editor&quot;:null,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;ju&quot;:{&quot;editor&quot;:null,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;says&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[],&quot;tsType&quot;:&quot;array&quot;},&quot;stamped&quot;:{&quot;editor&quot;:null,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;scored&quot;:{&quot;editor&quot;:null,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;plateImg&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">class Component extends DCLogic {
  renderVals() {
    const pr = this.props.pr || 0;
    const ju = this.props.ju || 0;
    return {
      plateImg: this.props.plateImg,
      stamped: this.props.stamped,
      scored: this.props.scored,
      notScored: !this.props.scored,
      says: this.props.says || [],
      praiseBg: pr ? '#3F7D3B' : 'transparent',
      praiseColor: pr ? '#fff' : '#22190F',
      praiseSuffix: pr ? ' ' + pr : '',
      judgeBg: ju ? '#DC4230' : 'transparent',
      judgeColor: ju ? '#fff' : '#22190F',
      judgeSuffix: ju ? ' ' + ju : ''
    };
  }
}</script>
</body>
</html>
