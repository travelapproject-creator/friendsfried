<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="border-top:1px solid rgba(34,25,15,.12);padding-bottom:12px">
  <div style="display:flex;align-items:center;gap:9px;padding:11px 12px">
    <span style="width:30px;height:30px;border-radius:50%;background:#F0E7D5;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0">🍕</span>
    <span style="font-weight:700;font-size:13.5px">Henry</span>
  </div>

  <div style="position:relative">
    <img src="{{ plateImg }}" alt="A margherita pizza" style="display:block;width:100%;aspect-ratio:1;object-fit:cover"></img>
    <sc-if value="{{ stamped }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:7px;animation:ffStampIn .4s cubic-bezier(.2,1.6,.5,1) both">
        <div style="display:flex;align-items:center;gap:7px;background:rgba(34,25,15,.7);border-radius:999px;padding:5px 11px;font-family:'Space Mono',monospace;font-size:11.5px;font-weight:700;color:#FBF7EC;white-space:nowrap">
          <span>👏 {{ pr }}</span>
          <span>🥴 {{ ju }}</span>
        </div>
        <div style="display:flex;align-items:baseline;justify-content:center;gap:2px;min-width:46px;background:#A8321F;color:#FBF7EC;border-radius:999px;padding:4px 12px 5px">
          <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;letter-spacing:-.045em;line-height:1">3.0</span>
        </div>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{ scored }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:baseline;gap:10px;padding:9px 12px 0;animation:ffFadeIn .35s ease both">
      <span style="flex:1;min-width:0;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.04em;color:#8C7C64;line-height:1.4">Margherita pizza · health 3.0/10</span>
      <span style="flex:0 0 auto;font-size:10.5px;color:#8C7C64;white-space:nowrap">Read it wrong? <span style="color:#6B5B48;text-decoration:underline;font-weight:700">Edit</span></span>
    </div>
  </sc-if>
  <sc-if value="{{ notScored }}" hint-placeholder-val="{{ true }}">
    <div style="padding:9px 12px 0;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.06em;color:#8C7C64">Reading the plate…</div>
  </sc-if>

  <sc-if value="{{ scored }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:center;gap:7px;padding:11px 12px 0">
      <div style="display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;border:1.5px solid #5F6B2A;background:{{ praiseBg }};color:{{ praiseColor }};font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:11.5px">👏 Praise</div>
      <div style="display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;border:1.5px solid #DC4230;background:{{ judgeBg }};color:{{ judgeColor }};font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:11.5px">🥴 Judge</div>
    </div>
  </sc-if>

  <div style="padding:0 12px">
    <sc-for list="{{ says }}" as="s" hint-placeholder-count="0">
      <div style="font-size:12px;line-height:1.4;margin-top:8px;animation:ffFadeIn .35s ease both">
        <b>{{ s.name }}</b> <span style="color:#4A3D2C">{{ s.text }}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:460},&quot;pr&quot;:{&quot;editor&quot;:null,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;ju&quot;:{&quot;editor&quot;:null,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;says&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[],&quot;tsType&quot;:&quot;array&quot;},&quot;stamped&quot;:{&quot;editor&quot;:null,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;scored&quot;:{&quot;editor&quot;:null,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;plateImg&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const pr = this.props.pr || 0;
    const ju = this.props.ju || 0;
    return {
      plateImg: this.props.plateImg,
      pr, ju,
      stamped: this.props.stamped,
      scored: this.props.scored,
      notScored: !this.props.scored,
      says: this.props.says || [],
      // Base health read is 3.0; each praise is +1 and each judgment -1. Four friends can vote, so the
      // most this can move is 4 either way.
      anyVotes: (pr + ju) > 0,
      // A filled pill is a vote you cast; outline is untouched.
      praiseBg: pr ? '#5F6B2A' : 'transparent',
      praiseColor: pr ? '#FBF7EC' : '#5F6B2A',
      judgeBg: ju ? '#DC4230' : 'transparent',
      judgeColor: ju ? '#FBF7EC' : '#DC4230'
    };
  }
}
</script>
</body>
</html>
